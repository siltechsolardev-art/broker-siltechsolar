<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="img/logo-siltech.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/index.css?v=1.1.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
<body>
    
    <section class="app-login">
    <div class="overlay"></div>
    <section class="container-login">
      <img src="img/logo-siltech.png" alt="Logo Siltech" class="logo-login">
          <p class="text-title font-hard color-first">Siltech Broker</p>
          <div class="container-text flex-center gap-high wid-90">
            <p class="text-normal color-black text-center">Acelere o processo de vendas, organize propostas e conduza negociações com mais eficiência</p>
          </div>
          <div class="wall-horizontal wid-90"></div>
        <div class="container-input ">
          <label for="input-usuario-login" class="label">Usuário</label>
          <div class="container-input-general">
            <div class="container-icon">
              <i class="bi bi-person text-title color-third"></i>
            </div>
            <input type="text" id="input-usuario-login" class="input-general" placeholder="Digite o nome do usuário"required>
          </div>
        </div>
        <div class="container-input">
          <label for="input-senha-login" class="label">Senha</label>
          <div class="container-input-general">
            <div class="container-icon">
            <i class="bi bi-key text-title color-third"></i>
            </div>
            <input type="password" id="input-senha-login" autocomplete="current-password" class="input-general" placeholder="Digite a senha do usuário" required>
            <div class="container-icon">
            <i class="bi bi-eye-slash text-title color-third" style="cursor: pointer;" id="mostrar-senha"></i>
            </div>
          </div>
        </div>
        
        <div class="container-text flex-center gap-high wid-90 hidden" id="p-error">
          <i class="bi bi-x-circle text-title color-red"></i>
          <p class="text-large color-red" >Credenciais inválidas. Tente novamente.</p>
        </div>
         <div class="bt gap-high background-first wid-90" id="btn-acessar">
              <div class="container-icon">
                <i class="bi bi-box-arrow-right text-title color-white"></i>
              </div>
                <p class="text-large color-white font-hard">Acessar Plataforma</p>
            </div>
      </form>
      <div class="container-text flex-center gap-high wid-90">
        <i class="bi bi-shield-check text-title color-green"></i>
        <p class="text-large color-green">Seus dados estão protegidos e seguros</p>
      </div>
       </section>
    </section>
    <script src="js/login/login.js"></script>
    <script src="js/login/index.js"></script>
</body>
</html>
